name: CI

on:
  push:
    branches: [ main, master, cyclotron ]
  pull_request:
  workflow_dispatch:

jobs:
  build-headless:
    name: "Build & test (headless)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            zlib1g-dev libpng-dev libfontconfig1-dev libfreetype-dev \
            libcairo2-dev libgsl-dev libhdf5-dev python3-numpy python3-h5py

      - name: Regenerate configure (autotools)
        run: ./reconf

      - name: Configure (headless, no GTK/OpenGL)
        run: ./configure --without-gtk3 --without-opengl

      - name: Build
        run: make -j"$(nproc)"

      - name: Run tests
        run: make check

      - name: Acceptance gate (R1/R2/R3 requirements)
        run: ./tests/cycl_acceptance

      - name: Validate VTK export (independent python cross-check)
        run: python3 python/tests/test_vtk_io.py

      - name: Validate HDF5 export (independent python cross-check)
        run: python3 python/tests/test_hdf5_io.py

  build-gui:
    name: "Build & test (default GUI)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (with GTK3)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            zlib1g-dev libpng-dev libfontconfig1-dev libfreetype-dev \
            libcairo2-dev libgsl-dev libgtk-3-dev libhdf5-dev python3-numpy python3-h5py

      - name: Regenerate configure (autotools)
        run: ./reconf

      - name: "Configure (default: GTK GUI enabled)"
        run: ./configure

      - name: Build
        run: make -j"$(nproc)"

      - name: Run tests
        run: make check

      - name: Acceptance gate (R1/R2/R3 requirements)
        run: ./tests/cycl_acceptance

      - name: Validate VTK export (independent python cross-check)
        run: python3 python/tests/test_vtk_io.py

      - name: Validate HDF5 export (independent python cross-check)
        run: python3 python/tests/test_hdf5_io.py

  adapters-python:
    name: "Adapter tooling (python)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python deps
        run: python3 -m pip install numpy h5py

      - name: Test magnet3d field converter
        run: python3 adapters/magnet3d/tests/test_field_to_fieldmap3d.py

      - name: Test rfcavity3d pillbox TM010
        run: python3 adapters/rfcavity3d/tests/test_pillbox_tm010.py

      - name: Test HDF5 reader
        run: python3 python/tests/test_hdf5_io.py
