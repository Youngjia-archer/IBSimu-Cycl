name: CI

on:
  push:
    branches: [ main, master, cyclotron ]
  pull_request:
  workflow_dispatch:

jobs:
  build-headless:
    name: "Build & test (headless)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            zlib1g-dev libpng-dev libfontconfig1-dev libfreetype-dev \
            libcairo2-dev libgsl-dev

      - name: Regenerate configure (autotools)
        run: ./reconf

      - name: Configure (headless, no GTK/OpenGL)
        run: ./configure --without-gtk3 --without-opengl

      - name: Build
        run: make -j"$(nproc)"

      - name: Run tests
        run: make check

  build-gui:
    name: "Build & test (default GUI)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (with GTK3)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            zlib1g-dev libpng-dev libfontconfig1-dev libfreetype-dev \
            libcairo2-dev libgsl-dev libgtk-3-dev

      - name: Regenerate configure (autotools)
        run: ./reconf

      - name: "Configure (default: GTK GUI enabled)"
        run: ./configure

      - name: Build
        run: make -j"$(nproc)"

      - name: Run tests
        run: make check

  adapters-python:
    name: "Adapter tooling (python)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python deps
        run: python3 -m pip install numpy

      - name: Test magnet3d field converter
        run: python3 adapters/magnet3d/tests/test_field_to_fieldmap3d.py

      - name: Test rfcavity3d pillbox TM010
        run: python3 adapters/rfcavity3d/tests/test_pillbox_tm010.py
