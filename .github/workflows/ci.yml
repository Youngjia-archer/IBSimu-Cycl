name: CI

on:
  push:
    branches: [ master, main, cyclotron ]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build & test (Linux, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            zlib1g-dev libpng-dev libfontconfig1-dev libfreetype-dev

      - name: Regenerate configure (autotools)
        run: ./reconf

      - name: Configure (headless, no GTK/OpenGL)
        run: ./configure --without-gtk3 --without-opengl

      - name: Build
        run: make -j"$(nproc)"

      - name: Run tests
        run: make check || true
